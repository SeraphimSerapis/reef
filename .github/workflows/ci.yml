name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv -p ${{ matrix.python }}
      - run: uv pip install -e ".[train]" --group dev
      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/pytest -q
        env:
          REEF_TEST_DATA: "1"
